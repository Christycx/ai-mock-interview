<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Question Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navbar: #F9FBFF;
            --navbar-text: #1E2A3A;
            --accent: #B8CCE0;
            --accent-dark: #2F5D8A;
            --accent-hover: #24496D;
            --accent-soft: #EAF1FA;
            --bg: #F5F7FB;
            --surface: #FFFFFF;
            --surface-soft: #FAFCFF;
            --text: #1B2430;
            --muted: #5B6472;
            --border: #D8E0EA;
            --danger-bg: #FFF5F5;
            --danger-text: #C53030;
            --danger-border: #E53E3E;
            --success-bg: #F0FFF4;
            --success-text: #276749;
            --success-border: #48BB78;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* FIXED TOP BAR */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--navbar);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 8px 24px rgba(30, 42, 58, 0.08);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: var(--navbar-text);
            text-decoration: none;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent), #9FB7D0);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-hover);
            font-size: 18px;
        }

        .user {
            width: 40px;
            height: 40px;
            background: #EAF0F7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--navbar-text);
            font-weight: 800;
            margin-right: 20px;
            border: 1px solid var(--border);
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
            padding-top: 70px;
            /* Space for fixed topbar */
        }

        .app-header {
            background: linear-gradient(135deg, #EAF1FA 0%, #F8FBFF 100%);
            color: var(--text);
            padding: 36px 60px;
            position: relative;
            overflow: hidden;
            max-width: 900px;
            margin: 30px auto;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 14px 30px rgba(27, 36, 48, 0.06);
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(47, 93, 138, 0.06) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .app-logo {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 1px solid rgba(216, 224, 234, 0.8);
        }

        .header-text h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header-text p {
            font-size: 16px;
            opacity: 0.9;
        }

        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 0 60px;
            background: transparent;
        }

        .page-banner {
            background: linear-gradient(135deg, #EAF1FA 0%, #F8FBFF 100%);
            color: var(--text);
            padding: 28px 80px;
            margin-bottom: 36px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .page-banner h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-banner p {
            font-size: 15px;
            opacity: 0.95;
        }

        .inner-content {
            padding: 0 80px;
        }

        .content-grid {
            display: block;
            max-width: 800px;
            margin: 0 auto 60px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .section-subtitle {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--navbar-text);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .required-indicator {
            color: var(--danger-border);
        }

        .form-input {
            padding: 16px 18px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            transition: all 0.3s ease;
            font-family: 'Manrope', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 3px rgba(47, 93, 138, 0.12);
        }

        .form-input::placeholder {
            color: #90A0B3;
        }

        /* Level section using cards */
        .level-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .level-btn {
            padding: 24px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .level-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
        }

        .level-btn.active {
            border-color: var(--accent-dark);
            background: linear-gradient(135deg, var(--accent-soft) 0%, #DCE8F5 100%);
            color: var(--accent-hover);
            box-shadow: 0 12px 28px rgba(47, 93, 138, 0.18);
        }

        .level-btn.active .level-info {
            color: white;
            color: var(--accent-hover);
        }

        .level-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .level-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .level-info {
            font-size: 14px;
            opacity: 0.8;
        }

        .submit-btn {
            padding: 18px 40px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent-hover) 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(47, 93, 138, 0.22);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Tips section styles */
        .tips-section {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .tips-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tips-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .tips-header h2 {
            color: var(--text);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .tips-header p {
            color: var(--muted);
            font-size: 18px;
        }

        .tips-progress {
            text-align: center;
            font-weight: 600;
            color: var(--accent-dark);
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tips-container {
            padding: 20px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .tip-item {
            background: #fafafa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
            border-left: 5px solid var(--accent-dark);
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }

        .tip-number {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent-hover) 100%);
            color: white;
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .tip-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .tip-icon {
            font-size: 32px;
        }

        .tip-title {
            color: #1a202c;
            font-size: 20px;
            font-weight: 700;
        }

        .tip-description {
            color: #2d3748;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .tip-details {
            color: #718096;
            font-size: 15px;
            line-height: 1.5;
            background: white;
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid var(--accent-dark);
        }

        .tips-footer {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .next-tips-btn,
        .start-interview-btn {
            background: linear-gradient(135deg, var(--accent-dark) 0%, var(--accent-hover) 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 250px;
        }

        .next-tips-btn:hover,
        .start-interview-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 106, 136, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            background: #ebf8ff;
            color: #2c5282;
            border-left: 4px solid #4299e1;
            border-radius: 10px;
            margin-top: 20px;
        }

        .loading.active {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 154, 139, 0.3);
            border-top-color: var(--accent-dark);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #fff5f5;
            color: #c53030;
            border-left: 4px solid #e53e3e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: #f0fff4;
            color: #276749;
            border-left: 4px solid #48bb78;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }

        .success-message.active {
            display: block;
        }

        .file-upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-area:hover {
            border-color: var(--accent-dark);
            background: #fff5f5;
        }

        .file-upload-area.has-file {
            border-color: var(--accent-dark);
            background: #ffe8e8;
        }

        .file-input {
            display: none;
        }

        .file-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .file-text {
            font-size: 15px;
            color: #4a5568;
            font-weight: 500;
        }

        .file-subtext {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 6px;
        }

        @media (max-width: 768px) {

            .app-header,
            .main-content {
                padding: 40px 30px;
            }

            .level-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- TOP NAVBAR -->
    <div class="topbar">
        <a href="/dashboard" class="logo">
            <div class="logo-icon">🤖</div>
            Interview Assistant
        </a>
        <div class="user">
            CX
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Full-width pastel banner -->
        <div class="page-banner">
            <h2>Configure Your Interview</h2>
            <p>Provide your details to generate customized interview questions</p>
        </div>

        <div class="inner-content">
        <div class="content-grid">
            <!-- Input Form Section -->
            <div class="form-section" id="formSection">
                <div class="form-group">
                    <label class="form-label" for="jobTitle">
                        Target Job Role
                        <span class="required-indicator">*</span>
                    </label>
                    <input type="text" id="jobTitle" class="form-input"
                        placeholder="e.g., Software Developer, Data Analyst, Product Manager" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="companyName">
                        Target Company
                        <span class="required-indicator">*</span>
                    </label>
                    <input type="text" id="companyName" class="form-input"
                        placeholder="e.g., Google, Microsoft, Amazon" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="resume">
                        Upload Resume (PDF)
                        <span class="required-indicator">*</span>
                    </label>
                    <input type="file" id="resume" class="file-input" accept=".pdf" required>
                    <label for="resume" class="file-upload-area" id="fileLabel">
                        <div class="file-icon">📄</div>
                        <div class="file-text" id="fileText">Click to upload your resume</div>
                        <div class="file-subtext">PDF format only</div>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Interview Level
                        <span class="required-indicator">*</span>
                    </label>
                    <div class="level-section">
                        <div class="level-btn beginner active" data-level="beginner">
                            <div class="level-icon">🟢</div>
                            <div class="level-title">Beginner</div>
                            <div class="level-info">10 Questions</div>
                        </div>
                        <div class="level-btn intermediate" data-level="intermediate">
                            <div class="level-icon">🟡</div>
                            <div class="level-title">Intermediate</div>
                            <div class="level-info">12 Questions</div>
                        </div>
                        <div class="level-btn advanced" data-level="advanced">
                            <div class="level-icon">🔴</div>
                            <div class="level-title">Advanced</div>
                            <div class="level-info">15 Questions</div>
                        </div>
                    </div>
                </div>

                <button class="submit-btn" id="nextBtn">
                    🚀 Next
                </button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p></p>
                </div>

                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>
            </div>
        </div>

        <!-- Tips Section -->
        <div class="tips-section" id="tipsSection">
            <div class="tips-header">
                <h2>📚 Essential Interview Tips</h2>
                <p id="tipsSubheader">Review these important tips before starting your interview</p>
            </div>

            <div class="tips-progress" id="tipsProgress">STEP 1 OF 3</div>

            <div class="tips-container" id="tipsContainer">
                <!-- Tips will be dynamically inserted here -->
            </div>

            <div class="tips-footer">
                <button class="next-tips-btn" id="nextTipsBtn">
                    ➡️ Next Tips
                </button>
                <button class="start-interview-btn" id="startInterviewBtn" style="display: none;">
                    🚀 Start Interview
                </button>
            </div>
        </div>
    </div>

    <script>
        // Load user data from localStorage for topbar initials
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('currentUser');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.name) {
                        const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase();
                        document.querySelector('.user').textContent = initials || 'U';
                    }
                } catch (e) {
                    console.error('Error parsing user data:', e);
                }
            }
        });

        let currentLevel = 'beginner';
        let currentTipsPage = 0;

        // File input: show filename in upload box
        document.getElementById('resume').addEventListener('change', function (e) {
            const label = document.getElementById('fileLabel');
            const fileText = document.getElementById('fileText');
            if (e.target.files.length > 0) {
                fileText.textContent = '📎 ' + e.target.files[0].name;
                label.classList.add('has-file');
            } else {
                fileText.textContent = 'Click to upload your resume';
                label.classList.remove('has-file');
            }
        });

        // 15 Interview tips
        const interviewTips = [
            {
                icon: "🔍",
                title: "Research Thoroughly",
                description: "Research the company, role, and industry trends before the interview",
                details: "Go beyond just the website. Look at recent news, product updates, and company culture on LinkedIn. Check their mission, values, and recent achievements."
            },
            {
                icon: "📄",
                title: "Know Your Resume",
                description: "Be prepared to explain everything on your resume in detail",
                details: "Practice explaining each project, internship, and skill mentioned in your resume. Quantify achievements and be ready to discuss challenges and solutions."
            },
            {
                icon: "💻",
                title: "Practice Technical Questions",
                description: "For technical roles, practice common algorithms and data structures",
                details: "Use platforms like LeetCode, HackerRank, or CodeSignal for practice. Focus on time and space complexity analysis."
            },
            {
                icon: "⭐",
                title: "Prepare STAR Stories",
                description: "Prepare 5-7 stories using the STAR method",
                details: "Situation, Task, Action, Result - structure your answers for behavioral questions. Focus on your specific contributions and outcomes."
            },
            {
                icon: "🗣️",
                title: "Clear and Concise Answers",
                description: "Keep your answers focused and to the point",
                details: "Aim for 1-2 minute answers. Practice summarizing complex ideas simply. Avoid rambling by structuring your thoughts."
            },
            {
                icon: "⏱️",
                title: "Control Your Pace",
                description: "Speak at a moderate pace - not too fast, not too slow",
                details: "Aim for 140-160 words per minute. Practice with a timer. Pause briefly before important points."
            },
            {
                icon: "🤐",
                title: "Minimize Filler Words",
                description: "Reduce 'um', 'uh', 'like', 'you know'",
                details: "Pause briefly instead of using filler words. Record yourself to identify patterns. Practice speaking more deliberately."
            },
            {
                icon: "💪",
                title: "Project Confidence",
                description: "Speak with energy and conviction",
                details: "Practice speaking from your diaphragm, not your throat. Stand up if possible. Use a confident tone."
            },
            {
                icon: "🎯",
                title: "Sit Up Straight",
                description: "Maintain good posture throughout",
                details: "Shoulders back, spine straight, head level. Avoid slouching or leaning. Good posture projects confidence."
            },
            {
                icon: "👁️",
                title: "Look at the Camera",
                description: "Look directly at the webcam as you are facing the interviewer",
                details: "Place the camera at eye level. Stick a note near the camera as a reminder. Practice maintaining eye contact."
            },
            {
                icon: "👐",
                title: "Use Natural Gestures",
                description: "Hand gestures can emphasize points",
                details: "Keep gestures above the waist, natural and not excessive. Avoid crossing arms. Use open palm gestures."
            },
            {
                icon: "😊",
                title: "Smile Naturally",
                description: "A genuine smile builds rapport",
                details: "Smile at appropriate moments, especially when greeting and ending. Maintain a pleasant expression throughout."
            },
            {
                icon: "🔧",
                title: "Test Your Equipment",
                description: "Test camera, microphone, and internet",
                details: "Do a test call with a friend. Check audio levels and video quality. Ensure good lighting and background."
            },
            {
                icon: "🌐",
                title: "Choose Quiet Location",
                description: "Find a quiet, professional-looking space,use earphones if needed",
                details: "Background should be clean and neutral. Good lighting is essential. Minimize distractions and noise."
            },
            {
                icon: "🧠",
                title: "Stay Positive and Confident",
                description: "Believe in your abilities and preparation",
                details: "Take deep breaths before starting. Focus on your strengths. Remember it's a conversation, not an interrogation."
            }
        ];

        // Level selection
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentLevel = this.dataset.level;
            });
        });

        // Next button click handler
        document.getElementById('nextBtn').addEventListener('click', async function () {
            const jobTitle = document.getElementById('jobTitle').value.trim();
            const companyName = document.getElementById('companyName').value.trim();
            const resumeFile = document.getElementById('resume').files[0];

            // Validation
            if (!jobTitle) {
                showError('Please enter a job title');
                return;
            }
            if (!companyName) {
                showError('Please enter a target company');
                return;
            }
            if (!resumeFile) {
                showError('Please upload a resume');
                return;
            }
            if (resumeFile.type !== 'application/pdf') {
                showError('Please upload a PDF file');
                return;
            }



            // Generate session ID locally if not already set
            if (!window.currentSessionId) {
                window.currentSessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            const formData = new FormData();
            formData.append('resume', resumeFile);
            formData.append('job_title', jobTitle);
            formData.append('company_name', companyName);
            formData.append('level', currentLevel);
            formData.append('session_id', window.currentSessionId);
            const userStr = localStorage.getItem('currentUser');
            console.log("DEBUG: currentUser from localStorage:", userStr);
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user && user.student_id) {
                        formData.append('student_id', user.student_id);
                        console.log("DEBUG: Appended student_id:", user.student_id);
                    } else {
                        console.warn("DEBUG: student_id missing in user object");
                    }
                } catch (e) {
                    console.error("DEBUG: Error parsing currentUser:", e);
                }
            } else {
                console.warn("DEBUG: No currentUser in localStorage. Are you logged in on this port/origin?");
            }

            document.getElementById('formSection').style.display = 'none';
            document.getElementById('tipsSection').classList.add('active');
            renderTipsPage(0);

            fetch('/generate-questions', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        showError(data.error || 'Question generation failed');
                    } else {
                        // Success!
                        showSuccess(`Successfully generated ${data.total_questions} questions!`);

                        // Store session_id if returned (backend might refine it)
                        if (data.session_id) {
                            window.currentSessionId = data.session_id;
                        }
                    }
                })
                .catch(err => {
                    console.error('API error:', err);
                    showError('An error occurred. Please try again.');
                });
        });

        // Start interview button
        document.getElementById('startInterviewBtn').addEventListener('click', function () {
            // Redirect to interview page with session_id and level
            let url = '/start-interview';
            let params = [];
            if (window.currentSessionId) {
                params.push(`session_id=${window.currentSessionId}`);
            }
            if (currentLevel) {
                params.push(`level=${currentLevel}`);
            }
            if (params.length > 0) {
                url += '?' + params.join('&');
            }
            window.location.href = url;
        });

        // Next Tips button click handler
        document.getElementById('nextTipsBtn').addEventListener('click', function () {
            if (currentTipsPage < 2) {
                currentTipsPage++;
                renderTipsPage(currentTipsPage);
            }
        });

        // Timer helper function
        let timerInterval;
        function startTimer(buttonId, duration, originalText, callback) {
            const btn = document.getElementById(buttonId);
            if (!btn) return;

            btn.disabled = true;
            let timeLeft = duration;

            if (timerInterval) clearInterval(timerInterval);

            btn.innerHTML = `${originalText} (${timeLeft}s)`;

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    if (callback) callback();
                } else {
                    btn.innerHTML = `${originalText} (${timeLeft}s)`;
                }
            }, 1000);
        }

        // Helper functions
        function renderTipsPage(page) {
            currentTipsPage = page;
            const container = document.getElementById('tipsContainer');
            if (!container) return;

            container.innerHTML = '';

            // Calculate start and end indices for current page (5 tips per page)
            const start = page * 5;
            const end = start + 5;
            const tipsToShow = interviewTips.slice(start, end);

            tipsToShow.forEach((tip, index) => {
                const tipElement = document.createElement('div');
                tipElement.className = 'tip-item';
                tipElement.innerHTML = `
                    <div class="tip-number">${start + index + 1}</div>
                    <div class="tip-content">
                        <div class="tip-header">
                            <span class="tip-icon">${tip.icon}</span>
                            <h3 class="tip-title">${tip.title}</h3>
                        </div>
                        <p class="tip-description">${tip.description}</p>
                        <div class="tip-details">${tip.details}</div>
                    </div>
                `;
                container.appendChild(tipElement);
            });

            // Update Progress Text
            document.getElementById('tipsProgress').textContent = `STEP ${page + 1} OF 3`;

            // Scroll container to top
            container.scrollTop = 0;

            // Handle button visibility
            const nextBtn = document.getElementById('nextTipsBtn');
            const startBtn = document.getElementById('startInterviewBtn');

            if (page === 2) {
                nextBtn.style.display = 'none';
                startBtn.style.display = 'block';
                startTimer('startInterviewBtn', 10, ' Start Interview');
            } else {
                nextBtn.style.display = 'block';
                startBtn.style.display = 'none';
                startTimer('nextTipsBtn', 10, '➡️ Next Tips');
            }
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('active', show);
            document.getElementById('nextBtn').disabled = show;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            setTimeout(() => errorDiv.classList.remove('active'), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('active');
            setTimeout(() => successDiv.classList.remove('active'), 3000);
        }

        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('successMessage').classList.remove('active');
        }
    </script>
</body>

</html>
