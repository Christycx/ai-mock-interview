<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Interview Voice Analysis</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
    }
    video {
      border: 3px solid #3498db;
      border-radius: 10px;
      width: 400px;
      height: 300px;
      background: black;
      margin: 15px 0;
    }
    button {
      margin: 10px;
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #3498db;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }
    button:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
      transform: none;
    }
    #result {
      margin-top: 30px;
      background: #f8f9fa;
      padding: 25px;
      border-radius: 12px;
      text-align: left;
      border-left: 5px solid #3498db;
    }
    .metric-card {
      background: white;
      margin: 15px 0;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .score-good { color: #27ae60; font-weight: bold; }
    .score-average { color: #f39c12; font-weight: bold; }
    .score-poor { color: #e74c3c; font-weight: bold; }
    .feedback-item {
      background: #e8f4fc;
      margin: 10px 0;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid #3498db;
    }
    .progress-bar {
      background: #ecf0f1;
      border-radius: 10px;
      height: 20px;
      margin: 10px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e74c3c, #f39c12, #27ae60);
      transition: width 0.5s ease;
    }
    .recording-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      background-color: #e74c3c;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .loading-spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 2s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Intermediate Voice Analysis</h1>
    <p>Record your interview answer and get detailed feedback on your delivery</p>
    
    <video id="video" autoplay muted></video><br>
    <button id="startBtn">🎬 Start Recording</button>
    <button id="stopBtn" disabled>⏹️ Stop & Analyze</button>

    <div id="result" style="display: none;"></div>
  </div>

  <script>
    let mediaRecorder, chunks = [];
    const videoElement = document.getElementById('video');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resultDiv = document.getElementById('result');

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then(stream => {
        videoElement.srcObject = stream;
        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp8',
          videoBitsPerSecond: 250000
        });

        mediaRecorder.ondataavailable = e => chunks.push(e.data);

        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const formData = new FormData();
          formData.append('video', blob, 'answer.webm');

          resultDiv.style.display = 'block';
          resultDiv.innerHTML = `
            <div style="text-align: center;">
              <div class="loading-spinner"></div>
              <p>⏳ Analyzing your response... This may take a moment.</p>
            </div>
          `;

          fetch('/analyze_voice', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
              if (data.error) {
                resultDiv.innerHTML = `<p style='color:red;'>${data.error}</p>`;
                return;
              }

              // Create progress bars for key metrics
              const getScoreClass = (score, max = 1) => {
                const percentage = (score / max) * 100;
                if (percentage >= 70) return 'score-good';
                if (percentage >= 40) return 'score-average';
                return 'score-poor';
              };

              const getWPMStatus = (wpm) => {
                if (wpm < 120) return { status: '🚶 Slow', class: 'score-poor' };
                if (wpm > 180) return { status: '🏃 Fast', class: 'score-poor' };
                return { status: '✅ Good', class: 'score-good' };
              };

              const wpmStatus = getWPMStatus(data.speech_rate_metrics.speaking_rate_wpm);

              resultDiv.innerHTML = `
                <h2>📊 Analysis Results</h2>
                
                <div class="metric-card">
                  <h3>🎯 Overall Confidence Score</h3>
                  <h2 class="${getScoreClass(data.overall_confidence_score, 100)}">
                    ${data.overall_confidence_score}%
                  </h2>
                </div>

                <div class="metric-card">
                  <h3>📝 Transcript</h3>
                  <p><em>"${data.transcript || 'No speech detected'}"</em></p>
                </div>

                <div class="metric-card">
                  <h3>🗣️ Speaking Rate & Fluency</h3>
                  <p><strong>Speaking Rate:</strong> ${data.speech_rate_metrics.speaking_rate_wpm} WPM 
                  <span class="${wpmStatus.class}">${wpmStatus.status}</span></p>
                  <p><strong>Total Words:</strong> ${data.speech_rate_metrics.word_count}</p>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${Math.min(100, (data.speech_rate_metrics.speaking_rate_wpm / 200) * 100)}%"></div>
                  </div>
                  <small>Ideal range: 120-180 WPM</small>
                </div>

                <div class="metric-card">
                  <h3>🚫 Filler Words & Verbal Tics</h3>
                  <p><strong>Filler Words:</strong> ${data.filler_analysis.filler_words_count} 
                  <span class="${getScoreClass(1 - data.filler_analysis.filler_ratio, 1)}">
                    ${data.filler_analysis.filler_ratio > 0.05 ? '❌ Needs work' : '✅ Good'}
                  </span></p>
                  <p><strong>Hedging Words:</strong> ${data.filler_analysis.hedging_words_count}
                  <span class="${getScoreClass(1 - (data.filler_analysis.hedging_words_count / data.speech_rate_metrics.word_count), 1)}">
                    ${data.filler_analysis.hedging_words_count > 3 ? '❌ Reduce' : '✅ Good'}
                  </span></p>
                  <p><strong>Sentence Restarts:</strong> ${data.filler_analysis.sentence_restarts}</p>
                  ${Object.keys(data.filler_analysis.repeated_words).length > 0 ? 
                    `<p><strong>Repeated Words:</strong> ${Object.entries(data.filler_analysis.repeated_words).map(([word, count]) => `<span class="score-average">${word} (${count}x)</span>`).join(', ')}</p>` : 
                    '<p><strong>Repeated Words:</strong> <span class="score-good">None detected ✅</span></p>'}
                </div>

                <div class="metric-card">
                  <h3>🎵 Voice Quality</h3>
                  <p><strong>Average Pitch:</strong> ${data.voice_quality_metrics.average_pitch_hz} Hz
                  <span class="${data.voice_quality_metrics.average_pitch_hz >= 100 && data.voice_quality_metrics.average_pitch_hz <= 250 ? 'score-good' : 'score-average'}">
                    ${data.voice_quality_metrics.average_pitch_hz < 100 ? 'Low' : data.voice_quality_metrics.average_pitch_hz > 250 ? 'High' : 'Normal'}
                  </span></p>
                  <p><strong>Pitch Variation:</strong> ${(data.voice_quality_metrics.pitch_variation * 100).toFixed(0)}%
                  <span class="${getScoreClass(data.voice_quality_metrics.pitch_variation)}">
                    ${data.voice_quality_metrics.pitch_variation > 0.6 ? 'Expressive' : data.voice_quality_metrics.pitch_variation > 0.3 ? 'Moderate' : 'Monotone'}
                  </span></p>
                  <p><strong>Volume Consistency:</strong> ${(data.voice_quality_metrics.volume_consistency * 100).toFixed(0)}%
                  <span class="${getScoreClass(data.voice_quality_metrics.volume_consistency)}">
                    ${data.voice_quality_metrics.volume_consistency > 0.8 ? 'Consistent' : data.voice_quality_metrics.volume_consistency > 0.6 ? 'Moderate' : 'Inconsistent'}
                  </span></p>
                  <p><strong>Voice Energy:</strong> ${(data.voice_quality_metrics.voice_energy * 100).toFixed(0)}%
                  <span class="${getScoreClass(data.voice_quality_metrics.voice_energy)}">
                    ${data.voice_quality_metrics.voice_energy > 0.7 ? 'Energetic' : data.voice_quality_metrics.voice_energy > 0.4 ? 'Moderate' : 'Low energy'}
                  </span></p>
                </div>

                <div class="metric-card">
                  <h3>⏱️ Pause Analysis</h3>
                  <p><strong>Strategic Pauses:</strong> ${data.pause_analysis.strategic_pauses} 
                  <span class="score-good">✅ Good for emphasis</span></p>
                  <p><strong>Hesitant Pauses:</strong> ${data.pause_analysis.hesitant_pauses} 
                  <span class="${data.pause_analysis.hesitant_pauses > data.pause_analysis.strategic_pauses ? 'score-poor' : 'score-good'}">
                    ${data.pause_analysis.hesitant_pauses > data.pause_analysis.strategic_pauses ? '❌ Too many' : '✅ Good'}
                  </span></p>
                  <p><strong>Total Silence:</strong> ${(data.pause_analysis.total_silence_ratio * 100).toFixed(1)}% of speech</p>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${Math.min(100, data.pause_analysis.total_silence_ratio * 200)}%"></div>
                  </div>
                  <small>Ideal: 10-20% silence for natural rhythm</small>
                </div>

                <div class="metric-card">
                  <h3>💪 Confidence Indicators</h3>
                  <p><strong>Assertiveness:</strong> ${(data.confidence_indicators.assertiveness_ratio * 100).toFixed(0)}%
                  <span class="${getScoreClass(data.confidence_indicators.assertiveness_ratio)}">
                    ${data.confidence_indicators.assertiveness_ratio > 0.8 ? 'Confident' : data.confidence_indicators.assertiveness_ratio > 0.6 ? 'Moderate' : 'Hesitant'}
                  </span></p>
                  <p><strong>Declarative Statements:</strong> ${data.confidence_indicators.declarative_sentences} 
                  <span class="score-good">✅ Clear statements</span></p>
                  <p><strong>Questioning Tones:</strong> ${data.confidence_indicators.questioning_sentences} 
                  <span class="${data.confidence_indicators.questioning_sentences > 3 ? 'score-poor' : 'score-good'}">
                    ${data.confidence_indicators.questioning_sentences > 3 ? '❌ Reduce uncertainty' : '✅ Good'}
                  </span></p>
                </div>

                <div class="metric-card">
                  <h3>📋 Improvement Feedback</h3>
                  ${data.feedback && data.feedback.length > 0 ? 
                    data.feedback.map(item => `<div class="feedback-item">${item}</div>`).join('') : 
                    '<div class="feedback-item">No specific feedback available. Your speech analysis completed successfully.</div>'}
                </div>

                <div class="metric-card" style="text-align: center; background: #e8f6f3; border-left: 5px solid #27ae60;">
                  <h3>💡 Tips for Improvement</h3>
                  <p><strong>Practice regularly</strong> to build confidence and reduce filler words</p>
                  <p><strong>Record yourself</strong> frequently to track progress</p>
                  <p><strong>Focus on one area</strong> at a time for gradual improvement</p>
                  <button onclick="location.reload()" style="background: #27ae60;">🔄 Try Another Recording</button>
                </div>
              `;
            })
            .catch(err => {
              console.error(err);
              resultDiv.innerHTML = `
                <div style="color: red; text-align: center;">
                  <h3>❌ Error Analyzing Voice</h3>
                  <p>Please try again. Make sure you're in a quiet environment and speak clearly.</p>
                  <button onclick="location.reload()" style="background: #e74c3c;">🔄 Try Again</button>
                </div>
              `;
            });

          chunks = [];
        };

        startBtn.onclick = () => {
          mediaRecorder.start();
          startBtn.disabled = true;
          stopBtn.disabled = false;
          resultDiv.style.display = 'none';
          
          // Update UI to show recording state
          startBtn.innerHTML = '<span class="recording-indicator"></span> Recording...';
        };

        stopBtn.onclick = () => {
          mediaRecorder.stop();
          startBtn.disabled = false;
          stopBtn.disabled = true;
          startBtn.innerHTML = '🎬 Start Recording';
          const tracks = videoElement.srcObject.getTracks();
          tracks.forEach(track => track.stop());
        };
      })
      .catch(err => {
        console.error('Media access error:', err);
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `
          <div style="color: red; text-align: center;">
            <h3>❌ Camera/Microphone Access Error</h3>
            <p>Could not access camera/microphone. Please check permissions and try again.</p>
            <p><small>Make sure you've allowed camera and microphone access for this site.</small></p>
            <button onclick="location.reload()" style="background: #e74c3c;">🔄 Retry</button>
          </div>
        `;
      });

    // Add keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !startBtn.disabled) {
        e.preventDefault();
        startBtn.click();
      } else if (e.code === 'Escape' && !stopBtn.disabled) {
        e.preventDefault();
        stopBtn.click();
      }
    });
  </script>
</body>
</html>
